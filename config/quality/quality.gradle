/**
 * Set up Checkstyle, Findbugs and PMD to perform extensive code analysis.
 *
 * Gradle tasks added:
 * - checkstyle
 * - spotbugs
 * - pmd
 *
 * The three tasks above are added as dependencies of the check task so running check will
 * run all of them.
 */

apply plugin: 'checkstyle'
apply plugin: 'com.github.spotbugs'
apply plugin: 'pmd'

dependencies {
    checkstyle 'com.puppycrawl.tools:checkstyle:6.5'
}

def qualityConfigDir = "$project.rootDir/config/quality"
def reportsDir = "$project.buildDir/reports"

check.dependsOn 'checkstyle', 'spotbugs', 'pmd'

task checkstyle(type: Checkstyle, group: 'Verification', description: 'Runs code style checks') {
    configFile file("$qualityConfigDir/checkstyle/checkstyle-config.xml")
    source 'src'
    include '**/*.java'

    reports {
        xml.required.set(true)
        xml.outputLocation.set(file("$reportsDir/checkstyle/checkstyle.xml"))
    }

    classpath = files()
}

spotbugs {
    ignoreFailures = false
    effort = "max"
    reportLevel = "high"
}

tasks.matching { it.class.name.contains('SpotBugsTask') }.configureEach {
    group = "verification"
    excludeFilter.set(new File("$qualityConfigDir/spotbugs/android-exclude-filter.xml"))
    classes = files("$project.rootDir/folioreader/build/intermediates/javac")

    reports {
        xml.required.set(false)
        html.required.set(true)
        xml.outputLocation.set(file("$reportsDir/spotbugs/spotbugs.xml"))
        html.outputLocation.set(file("$reportsDir/spotbugs/spotbugs.html"))
    }
}

task pmd(type: Pmd, group: 'Verification', description: 'Inspect sourcecode for bugs') {
    ruleSetFiles = files("$qualityConfigDir/pmd/pmd-ruleset.xml")
    ignoreFailures = false
    ruleSets = []

    source 'src'
    include '**/*.java'
    exclude '**/gen/**'

    reports {
        xml.required.set(true)
        html.required.set(true)
        xml.outputLocation.set(file("$reportsDir/pmd/pmd.xml"))
        html.outputLocation.set(file("$reportsDir/pmd/pmd.html"))
    }
}